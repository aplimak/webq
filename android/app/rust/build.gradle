plugins {
    id 'com.android.library'
}

def rustRoot = new File(project.rootDir.parentFile, 'rust')
def rustSources = files(
        fileTree("$rustRoot/src"),
        file("$rustRoot/Cargo.toml"),
        file("$rustRoot/Cargo.lock")
)

android {
    namespace 'uniffi.webq_rs'

    defaultConfig {
        minSdk 24

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        targetSdk 37
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    compileSdk = 37
}

dependencies {
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def capName = variant.name.capitalize()
        def cargoTargetDir = file("${layout.buildDirectory.get()}/cargo_target/${variant.name}")
        def rustLibsDir = file("${layout.buildDirectory.get()}/rustLibs/${variant.name}")
        def generatedKotlinDir = file("${layout.buildDirectory.get()}/generated/uniffi/${variant.name}")

        tasks.register("cargo${capName}Build", Exec) {
            inputs.files(rustSources)
            outputs.dir(cargoTargetDir)
            outputs.dir(rustLibsDir)
            outputs.dir(generatedKotlinDir)
            workingDir rustRoot
            environment 'CARGO_TARGET_DIR', cargoTargetDir
            commandLine 'bash', '-c', ". common.sh; cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 " +
                    "-o ${rustLibsDir.absolutePath} build ${variant.name == 'debug' ? '' : '--release'} && " +
                    "uniffi-bindgen generate --library ${rustLibsDir.absolutePath}/arm64-v8a/libwebq_rs.so " +
                    "--language kotlin --out-dir ${generatedKotlinDir.absolutePath}"
        }

        android.sourceSets.named(variant.name) {
            it.kotlin.srcDir(generatedKotlinDir)
            it.jniLibs.srcDir(rustLibsDir)
        }

        tasks.matching { it.name == "compile${capName}Kotlin" || it.name == "merge${capName}JniLibFolders" || it.name == "extract${capName}Annotations" }.configureEach {
            dependsOn "cargo${capName}Build"
        }
    }
}