apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    kotlinOptions {
        jvmTarget = '11'
    }
    namespace = "ir.aeliux.webq"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.aeliux.webq"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    def localProperties = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localProperties.load(new FileInputStream(localPropsFile))
    }

    signingConfigs {
        release {
            storeFile file(localProperties.getProperty("KEYSTORE_PATH"))
            storePassword localProperties.getProperty("KEYSTORE_PASSWORD")
            keyAlias localProperties.getProperty("KEY_ALIAS")
            keyPassword localProperties.getProperty("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation project(':app:rust')
}

apply from: 'capacitor.build.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('DistRelease') {
    dependsOn 'assembleRelease'
    doLast {
        def variant = android.applicationVariants.find { it.name == "release" }
        def outputFile = variant.outputs[0].outputFile

        def customDir = file("../../dist")
        customDir.mkdirs()
        def destFile = new File(customDir, outputFile.name)

        copy {
            from outputFile
            into customDir
            rename { outputFile.name }
        }

        println "Release artifact copied to: ${destFile.absolutePath}"
    }
}

android.applicationVariants.all { variant ->
    def bundleDir = new File(project.rootDir.parentFile, "bundle/cap/${variant.name}")
    def assetTargetDir = file('src/main/assets/public')

    tasks.register("verify${variant.name.capitalize()}WebAssets") {
        // Fail if source does not exist or is not a directory
        if (!bundleDir.exists() || !bundleDir.isDirectory()) {
            throw new GradleException("Source directory does not exist or is not a directory: ${bundleDir.absolutePath}")
        }
        // Optional: ensure the destination parent directory can be created
        if (!assetTargetDir.parentFile.exists() && !assetTargetDir.parentFile.mkdirs()) {
            throw new GradleException("Cannot create destination parent directory: ${assetTargetDir.parentFile.absolutePath}")
        }
    }

    tasks.register("copy${variant.name.capitalize()}WebAssets", Sync) {
        dependsOn "verify${variant.name.capitalize()}WebAssets"

        inputs.dir(bundleDir)
        outputs.dir(assetTargetDir)

        from bundleDir
        into assetTargetDir
    }

    tasks.named("pre${variant.name.capitalize()}Build") {
        dependsOn "copy${variant.name.capitalize()}WebAssets"
    }
}