apply plugin: 'com.android.application'

android {
    namespace = "ir.aeliux.webq"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.aeliux.webq"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    def localProperties = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localProperties.load(new FileInputStream(localPropsFile))
    }

    signingConfigs {
        release {
            storeFile file(localProperties.getProperty("KEYSTORE_PATH"))
            storePassword localProperties.getProperty("KEYSTORE_PASSWORD")
            keyAlias localProperties.getProperty("KEY_ALIAS")
            keyPassword localProperties.getProperty("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation project(':app:rust')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

import com.android.build.api.artifact.SingleArtifact

androidComponents {
    onVariants(selector().all()) { variant ->
        def capName = variant.name.capitalize()
        def bundleDir = file("${rootDir}/../bundle/cap/${variant.name}")
        def assetTargetDir = file('src/main/assets/public')

        // Verify source directory exists
        def verifyTask = tasks.register("verify${capName}WebAssets") {
            doLast {
                if (!bundleDir.exists() || !bundleDir.isDirectory()) {
                    throw new GradleException(
                            "Source directory does not exist: ${bundleDir.absolutePath}"
                    )
                }
                if (!assetTargetDir.parentFile.exists() && !assetTargetDir.parentFile.mkdirs()) {
                    throw new GradleException(
                            "Cannot create destination parent: ${assetTargetDir.parentFile.absolutePath}"
                    )
                }
            }
        }

        // Copy web assets
        def copyTask = tasks.register("copy${capName}WebAssets", Sync) {
            dependsOn verifyTask
            inputs.dir(bundleDir)
            outputs.dir(assetTargetDir)
            from bundleDir
            into assetTargetDir
        }

        // Hook into the asset merging task (lazy – works even if not yet registered)
        tasks.matching { it.name == "merge${capName}Assets" }.configureEach {
            dependsOn copyTask
        }
    }

    onVariants(selector().withBuildType("release")) { variant ->
        def capName = variant.name.capitalize()

        tasks.register('DistRelease') {
            // Depend on the standard assemble task
            dependsOn tasks.named("assemble${capName}")

            doLast {
                // Get the APK using the modern artifact API
                def apk = variant.artifacts.get(SingleArtifact.APK).get().asFile

                def customDir = file("${rootDir}/../../dist")
                customDir.mkdirs()
                copy {
                    from apk
                    into customDir
                    rename { apk.name }
                }
                println "Release artifact copied to: ${customDir.absolutePath}/${apk.name}"
            }
        }
    }
}