<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="notranslate">
    <meta name="theme-color" content="#2e2e2e">
    <meta name="color-scheme" content="light dark">
    <title>WebQ</title>
    <script src="cordova.js"></script>
  </head>
  <body data-theme="dark">
    <header id="header" class="header flex-row center">
      <div class="header-title">WebQ</div>
      <div class="header-actions flex-row center gapped">
        <button id="install-pwa" class="button bordered padded center hide">
          <span>Install</span>
        </button>
        <button id="switch-theme" class="button bordered padded center hide">
          <span class="fast material-icons"></span>
        </button>
      </div>
    </header>
    <div id="content" class="main-content flex-col fade-in">
      <noscript>
        <h1>Unsupported browser or javascript is disabled</h1>
      </noscript>
    </div>
    <div id="loading-container">
      <div id="loading">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <div class="toast-container flex-col center" id="toast-container"></div>
  </body>
</html>
