<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="notranslate">
    <meta name="theme-color" content="#2e2e2e">
    <meta name="color-scheme" content="light dark">
  </head>
  <body data-theme="dark">
    <header id="header" class="flex-row center">
      <div id="branding" class="flex-row center">
        <img id="icon" src="../assets/icon_monochrome.png" />
        <div id="title"></div>
      </div>
      <div class="flex-row center gapped">
        <button id="install-pwa" class="button bordered padded center hide">
          <span>Install</span>
        </button>
        <button id="switch-theme" class="button bordered padded center hide">
          <span class="fast material-icons"></span>
        </button>
        <button id="window-minimize" class="button bordered padded center hide">
          <span class="material-symbols-outlined">minimize</span>
        </button>
        <button id="window-maximize" class="button bordered padded center hide">
          <span class="material-symbols-outlined"></span>
        </button>
        <button id="window-close" class="button bordered padded center hide">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </header>
    <div id="content" class="flex-col fade-in">
      <noscript>
        <h1>Unsupported browser or javascript is disabled</h1>
      </noscript>
    </div>
    <div id="loading-container">
      <div id="loading">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <div id="toast-container" class="flex-col center"></div>
  </body>
</html>
