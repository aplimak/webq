<div id="ai-response" class="flex-col padded gapped center" dir="ltr" lang="en"></div>
<div
  id="ai-bottom-bar"
  class="flex-row flex-mobile middle center padded gapped"
  dir="ltr"
  lang="en"
>
  <div class="flex-row center gapped">
    <button id="ai-dir" class="button bordered padded">RTL</button>
    <select id="ai-model" class="button bordered flex-row center"></select>
  </div>
  <div class="flex-row center gapped" style="flex-grow: 1">
    <input id="ai-prompt" placeholder="Write Message" class="form-control padded" />
    <button id="ai-send" class="button bordered padded flex-row center">
      <span class="material-icons">send</span>
    </button>
  </div>
</div>
