<div class="flex-row center gapped">
  <span class="text bold">$name$</span>
  <span class="text bold">·</span>
  <span class="text" style="font-family: monospace">$timestamp$</span>
</div>
<div class="flex-row center gapped spaced">
  <span style="overflow: hidden" title="$olog$">$log$</span>
  <div id="event-status-container" class="flex-row center gapped">
    <span class="status-pill $old_status$">$old_status$</span>
    <span class="material-icons">arrow_forward</span>
    <span class="status-pill $new_status$">$new_status$</span>
  </div>
</div>
