<div class="flex-col gapped middle padded">
  <div class="flex-row gapped center">
    <span class="text bold" style="word-break: break-word; overflow-wrap: break-word">$name$</span>
    <span id="site-link-icon" class="text center hide-desktop material-icons">link</span>
    <span class="text bold hide-mobile">·</span>
    <span class="text hide-mobile" style="font-family: monospace">$mode$</span>
  </div>
  <span class="text hide-mobile" style="margin-top: auto">$addr$</span>
</div>
<div class="flex-row center" style="gap: 16px">
  <div id="site-status-container" class="flex-col center hide-mobile" style="gap: 4px; width: 70px">
    <span id="site-status" class="status-pill $status$">$status$</span>
    <div class="flex-row center middle" style="gap: 4px">
      <span class="material-icons">access_time</span>
      <span id="site-last-check" class="text" style="font-family: monospace">$last_check$</span>
    </div>
  </div>
  <div class="flex-row gapped center">
    <button id="site-delete" class="button bordered flex-row center padded gapped hide-mobile">
      <span class="material-icons">delete</span>
    </button>
    <button id="site-check" class="button bordered flex-row center padded gapped">
      <span class="material-icons">play_arrow</span>
    </button>
  </div>
</div>
