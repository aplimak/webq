<div id="connection-monitor" class="flex-row flex-mobile">
    <div class="flex-col dgapped">
        <div class="card prime flex-col padded">
            <div class="flex-row gapped middle spaced" style="margin-bottom: 8px; padding-top: 8px;">
                <div class="flex-row gapped">
                    <button id="svc-ctl" class="button filled primary padded gapped flex-row center">
                        <span class="material-icons">play_circle_outline</span>
                        <span>Start</span>
                    </button>
                    <button id="check-run" class="button filled secondary padded gapped flex-row center">
                        <span class="material-icons">play_arrow</span>
                        <span>Run</span>
                    </button>
                </div>
                <button id="refresh-all" class="button filled secondary padded gapped flex-row center">
                    <span class="material-icons">replay</span>
                </button>
            </div>
            <div id="server-info" class="card flat flex-col hide-mobile" style="padding: 16px; gap: 4px; margin-top: 8px;">
                <div class="flex-row spaced">
                    <span class="text bold">Last Check Run:</span>
                    <span id="check-last-run" class="text"></span>
                </div>
                <div class="flex-row spaced">
                    <span class="text bold">Last Service Run:</span>
                    <span id="svc-last-run" class="text"></span>
                </div>
                <div class="flex-row spaced">
                    <span class="text bold">Next Service Run:</span>
                    <span id="svc-next-run" class="text"></span>
                </div>
                <div class="flex-row spaced">
                    <span class="text bold">Last Event:</span>
                    <span id="last-event" class="text">5m ago</span>
                </div>
            </div>
            <div id="server-info-ctl" class="flex-row center middle hide-desktop" style="margin-top: 8px;">
                <span class="text bold">More Info</span>
                <span class="material-icons" style="font-size: 2em !important; margin-top: 2px;">keyboard_arrow_down</span>
            </div>
        </div>
        <div class="card prime flex-col padded gapped">
            <div class="flex-row title spaced center">
                <span class="text bold">Events</span>
                <div class="flex-row gapped center">
                    <button id="clear-events" class="button bordered flex-row center padded gapped hide-mobile">
                        <span class="material-icons">delete</span>
                    </button>
                    <button id="refresh-events" class="button bordered flex-row center padded gapped hide-mobile">
                        <span class="material-icons">replay</span>
                    </button>
                    <span id="events-ctl" class="material-icons hide-desktop" style="font-size: 1.5em !important; margin-top: 2px;">keyboard_arrow_down</span>
                </div>
            </div>
            <div id="events-container" class="flex-col gapped hide-mobile"></div>
        </div>
    </div>
    <div class="card prime flex-col padded gapped" style="flex: 1; min-height: 350px;">
        <div class="flex-row title spaced center">
            <span class="text bold">Sites</span>
            <div class="flex-row gapped center">
                <button id="add-site" class="button bordered flex-row center padded gapped hide-mobile">
                    <span class="material-icons">add</span>
                </button>
                <button id="clear-sites" class="button bordered flex-row center padded gapped hide-mobile">
                    <span class="material-icons">delete</span>
                </button>
                <button id="refresh-sites" class="button bordered flex-row center padded gapped hide-mobile">
                    <span class="material-icons">replay</span>
                </button>
            </div>
        </div>
        <div id="sites-filter-bar" class="flex-row center gapped" style="margin-bottom: 8px;">
            <button data-site-filter="all" class="button filled primary gapped flex-row center no-hover">
                <span>All</span>
            </button>
            <button data-site-filter="up" class="button filled secondary gapped flex-row center no-hover">
                <span>UP</span>
            </button>
            <button data-site-filter="partial" class="button filled secondary gapped flex-row center no-hover">
                <span>PARTIAL</span>
            </button>
            <button data-site-filter="down" class="button filled secondary gapped flex-row center no-hover">
                <span>DOWN</span>
            </button>
        </div>
        <div id="sites-container" class="gapped"></div>
    </div>
</div>
