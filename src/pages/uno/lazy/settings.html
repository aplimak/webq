<div class="flex-row center" style="padding-right: 13px">
  <span>Players</span>
  <button id="reset-players" class="button flat center material-icons"
    style="margin-left: auto">
    replay
  </button>
  <button id="add-player" class="button flat center material-icons">add</button>
</div>
<div class="form-group flex-col config-players"></div>

<div class="form-group">
  <label for="max-score-input">Max Score:</label>
  <input
    id="max-score-input"
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    class="form-control fade-in"
    placeholder="Score" />
</div>
