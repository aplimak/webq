<h1>Welcome to WebQ</h1>
<p>Here are some simple apps!</p>

<div class="card-container flex-col">
  <div id="uno-card" class="service-card card prime flex-col">
    <div class="title-container flex-row center">
      <span class="card-title">Uno Score Counter</span>
    </div>
    <span class="card-text">Track uno game scores and progress</span>
    <div class="button-container flex-row center">
      <button id="uno-button"
        class="button filled flex-row center padded gapped bold primary">
        <span class="material-icons">games</span>
        <span>Enter</span>
      </button>
    </div>
  </div>
  <div id="test-card" class="service-card card prime flex-col">
    <div class="title-container flex-row center">
      <span class="card-title">Test</span>
    </div>
    <span class="card-text">Test various parts</span>
    <div class="button-container flex-row center">
      <button id="toast-button"
        class="button filled flex-row center padded gapped bold secondary">
        <span>Toast</span>
      </button>
    </div>
  </div>
</div>
